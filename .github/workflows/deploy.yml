name: Deploy docnumber.pilargroup.id

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to GCP
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1. Checkout
      # -------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # -------------------------
      # 2. Setup Node.js
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      # -------------------------
      # 3. Install dependencies & build frontend
      # -------------------------
      - name: Install dependencies & build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      # -------------------------
      # 4. Setup SSH key
      # -------------------------
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.GCP_HOST }} >> ~/.ssh/known_hosts

      # -------------------------
      # 5. Debug SSH connection
      # -------------------------
      - name: Debug SSH connection
        run: |
          echo ">> Check DNS"
          nslookup ${{ secrets.GCP_HOST }}

          echo ">> Check generated public key from GitHub secret"
          ssh-keygen -y -f ~/.ssh/deploy_key

          echo ">> Test SSH"
          ssh \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }} \
            "whoami && hostname"

      # -------------------------
      # 6. Pull latest Docnumber code on VM
      # -------------------------
      - name: Pull latest code on VM
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/deploy_key \
            ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }} "
              set -e

              if [ ! -d /var/www/docnumber/.git ]; then
                echo '>> /var/www/docnumber not found, cloning repo (first-time deploy)'
                sudo mkdir -p /var/www/docnumber
                sudo chown \$(whoami):\$(whoami) /var/www/docnumber
                git clone '$REPO_URL' /var/www/docnumber
              fi

              cd /var/www/docnumber

              echo '>> Sync latest Docnumber code'
              git fetch '$REPO_URL' main
              git reset --hard FETCH_HEAD
              git remote set-url origin https://github.com/${{ github.repository }}.git

              git clean -fd \
                -e backend/.env \
                -e backend/.env.local \
                -e backend/credentials/
            "

      # -------------------------
      # 7. Upload frontend build
      # -------------------------
      - name: Upload frontend build to VM
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }} "
              mkdir -p /var/www/docnumber/frontend/dist
            "

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }}:/var/www/docnumber/frontend/dist/

      # -------------------------
      # 8. Finalize backend deploy
      # -------------------------
      - name: Finalize backend deploy on VM
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            ${{ secrets.GCP_USER }}@${{ secrets.GCP_HOST }} "
              set -e

              export NVM_DIR=\"\$HOME/.nvm\"
              [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"

              nvm use 24.14.0

              echo '>> Check Node'
              node -v
              npm -v
              pm2 -v

              cd /var/www/docnumber/backend

              echo '>> Install backend dependencies'
              npm install

              echo '>> Restart Docnumber PM2 app'
              pm2 restart docnumber-api --update-env || \
                pm2 start npm \
                  --name docnumber-api \
                  --cwd /var/www/docnumber/backend \
                  -- run start

              echo '>> Save PM2 process list'
              pm2 save

              echo '>> Reload nginx'
              sudo nginx -t
              sudo systemctl reload nginx

              echo '>> Docnumber deploy selesai'
            "
